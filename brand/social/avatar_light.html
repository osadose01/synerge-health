<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 400px;
  height: 400px;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}
.squircle {
  width: 320px;

  border-radius: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
}
.squircle svg {
  width: 190px !important;
  height: 190px !important;
}
</style>
</head>
<body>
<div class="squircle">

</html>
