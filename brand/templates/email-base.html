<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#EEF3F1;">
  <!-- Preheader: one short line shown in the inbox preview -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#EEF3F1;">{{preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EEF3F1;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#FFFFFF;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background-color:#060B09;padding:28px 32px;border-top:3px solid #2BE0B0;">
              <a href="https://synergehealth.com" style="text-decoration:none;">
                <img src="https://synergehealth.com/brand/logo-primary.png" width="224" height="32" alt="Synerge Health" style="display:block;border:0;outline:none;width:224px;height:32px;">
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 12px 32px;font-family:Arial,Helvetica,sans-serif;color:#0D1815;font-size:16px;line-height:1.65;">
              <h1 style="margin:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:24px;line-height:1.25;color:#0D1815;">{{headline}}</h1>
              <p style="margin:0 0 16px 0;">Hello {{first_name}},</p>
              <p style="margin:0 0 16px 0;">{{body}}</p>
            </td>
          </tr>
          <!-- Primary action: optional. Remove this row when the message has no action. -->
          <tr>
            <td style="padding:8px 32px 32px 32px;">
              <a href="{{cta_url}}" style="display:inline-block;background-color:#E3A83B;color:#060B09;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;padding:14px 28px;border-radius:999px;">{{cta_label}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px 32px;font-family:Arial,Helvetica,sans-serif;color:#0D1815;font-size:16px;line-height:1.65;">
              <p style="margin:0;">Regards,<br>{{sender_name}}<br><span style="color:#4A5E56;">{{sender_title}}, Synerge Health</span></p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#060B09;padding:24px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#8FA39A;">
              <p style="margin:0 0 8px 0;color:#C2D1CB;">Synerge Health &middot; Africa&rsquo;s healthtech venture studio</p>
              <p style="margin:0;">
                <a href="https://synergehealth.com" style="color:#2BE0B0;text-decoration:none;">synergehealth.com</a>
                &nbsp;&middot;&nbsp;
                <a href="https://synergehealth.com/privacy" style="color:#8FA39A;text-decoration:underline;">Privacy</a>
                <!-- Newsletter sends only: keep the unsubscribe link -->
                &nbsp;&middot;&nbsp;
                <a href="{{unsubscribe_url}}" style="color:#8FA39A;text-decoration:underline;">Unsubscribe</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
